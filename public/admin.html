<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>Admin · Guest WiFi</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 9.5a11 11 0 0 1 14 0M8 12.5a6.5 6.5 0 0 1 8 0M11 15.5a2 2 0 0 1 2 0"/><path d="M12 19h.01"/></svg></span><span>GUEST<span class="brand-light">WIFI</span></span></a>
  <a class="admin-link" href="/">Zur Website <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
</header>
<main class="admin-wrap">
  <div class="eyebrow">VERWALTUNG</div><h1>Adminbereich</h1><p class="intro">Dein Gäste-WLAN auf einen Blick.</p>
  <section class="admin-card" id="login-card">
    <h2>Anmelden</h2><p class="muted">Melde dich an, um die WLAN-Einstellungen zu verwalten.</p>
    <form id="login-form"><label>Benutzername<input name="username" autocomplete="username" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Anmelden</button><p class="form-error" id="login-error"></p></form>
  </section>
  <section class="admin-card hidden" id="settings-card">
    <div class="settings-head"><div><h2>WLAN-Einstellungen</h2><p class="muted">Deine Änderungen werden direkt übernommen.</p></div><button class="logout" id="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>Abmelden</button></div>
    <form id="settings-form">
      <label>WLAN-Name (SSID)<input name="ssid" maxlength="32" required></label>
      <label>WLAN-Passwort<div class="pass-wrap"><input name="password" id="wifi-password" type="password" maxlength="63" autocomplete="new-password"><button type="button" class="reveal" id="reveal" aria-label="Passwort anzeigen" title="Passwort anzeigen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></label>
      <label>Verschlüsselung<select name="security"><option value="WPA">WPA / WPA2 / WPA3</option><option value="nopass">Offenes WLAN (ohne Passwort)</option></select></label>
      <label class="check"><input type="checkbox" name="hidden"> Versteckte SSID</label>
      <label class="check"><input type="checkbox" name="enabled"> Gäste-WLAN öffentlich anzeigen</label>
      <button class="primary" type="submit">Änderungen speichern</button><p class="form-error" id="settings-error"></p><p class="success" id="settings-success"></p>
    </form>
    <div class="qr-preview"><div><strong>QR-Code</strong><p class="muted">Wird automatisch aktualisiert.</p></div><a href="/api/qr.png" download="guest-wifi-qr.png" class="download-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg> PNG laden</a></div>
  </section>
</main>
<footer>GUEST WIFI <span>·</span> ADMINISTRATION</footer>
<script src="/admin.js"></script>
</body></html>
