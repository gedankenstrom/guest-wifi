<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>Guest WiFi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 9.5a11 11 0 0 1 14 0M8 12.5a6.5 6.5 0 0 1 8 0M11 15.5a2 2 0 0 1 2 0"/><path d="M12 19h.01"/></svg></span>
    <span>GUEST<span class="brand-light">WIFI</span></span>
  </a>
  <a class="admin-link" href="/admin.html">Admin <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
</header>
<main class="public-wrap">
  <div class="eyebrow"><span class="live-dot"></span> GÄSTEZUGANG</div>
  <h1 id="headline">Willkommen.</h1>
  <p class="intro" id="subtitle">Verbinde dich in wenigen Sekunden mit unserem WLAN.</p>
  <section class="wifi-card">
    <div class="qr-side">
      <div class="qr-frame"><img id="qr" alt="WLAN QR-Code"></div>
      <div class="scan-note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v2M17 20h4M20 18v3"/></svg> Mit der Kamera scannen</div>
    </div>
    <div class="details">
      <div class="connected-label"><span class="live-dot"></span> WLAN BEREIT</div>
      <div class="field-label">NETZWERKNAME</div>
      <div class="ssid" id="ssid">–</div>
      <div class="field-label password-label">PASSWORT</div>
      <div class="password-row"><span id="password">–</span><button id="copy" class="icon-btn" aria-label="Passwort kopieren" title="Passwort kopieren"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div>
      <button class="download-btn" id="download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg> QR-Code laden</button>
      <p class="footnote">Scanne den Code, um dich automatisch mit dem Gäste-WLAN zu verbinden.</p>
    </div>
  </section>
  <div class="bottom-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg> Sicher verbunden</div>
</main>
<footer>GUEST WIFI <span>·</span> PRIVATE NETWORK ACCESS</footer>
<div class="toast" id="toast" role="status"></div>
<script src="/public.js"></script>
</body>
</html>
